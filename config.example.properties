# CoTalk v0.3.5(beta) 配置模板
# 复制为 config.properties 后修改；config.properties 不提交到仓库。
# 首次启动时，若 config.properties 不存在，会自动生成默认配置。

config.version=3200
server.port=4700
server.maxClients=50
server.joinTimeoutMs=10000
server.heartbeatTimeoutMs=90000

# 客户端连接密钥；留空时首次启动会自动生成随机密钥
auth.key=

room.name=CoTalk 大厅
room.announcement=欢迎来到 CoTalk
# 房间自定义头像路径；留空表示使用默认样式
room.avatar=

db.path=data/cotalk.db
history.recent=50
history.maxFetch=200
avatar.maxBytes=204800

# 房间功能开关；关闭后服务端拒绝接收对应类型
features.image=true
features.voice=true
features.emoji=true

# 后台推送能力声明
push.enabled=true
# 断线重连宽限（毫秒）
server.reconnectGraceMs=15000

# 管理员模式（实验性）；密钥以 PBKDF2 verifier 保存
# salt/verifier 使用 Base64 URL 无填充；建议通过可视化设置生成
admin.enabled=false
admin.salt=
admin.iterations=120000
admin.verifier=

# AI 群友 Pro（实验性功能）；开启后使用新的记忆/核心提示词回复链路
ai.pro.enabled=false
ai.pro.model=
ai.pro.maxTokens=0
ai.pro.timeoutMs=0
ai.pro.prompt.contextMessages=10
ai.pro.prompt.maxChars=6000
ai.pro.prompt.maxMemoryChars=1200
ai.pro.owner.names=
ai.pro.migrate.importHistory=false
ai.pro.migrate.backup=true
ai.pro.round.intervalMs=1200000
ai.pro.round.messageCount=10
ai.pro.round.maxMessages=200
ai.pro.round.minMessages=1
ai.pro.round.pendingMax=1
ai.pro.deep.max=200
ai.pro.shallow.max=1000
ai.pro.cache.max=5000
ai.pro.cache.cleanupEveryRounds=5
ai.pro.cache.cleanupTargetRatio=0.8
ai.pro.cache.ttlDays=90
ai.pro.cache.ttlMinDays=30
ai.pro.compress.keepRatio=0.5
ai.pro.layer.cooldownMs=1800000
ai.pro.layer.maxMovesPerRound=100
ai.pro.memory.maxAccessCount=10000
ai.pro.extract.maxPerRound=3
ai.pro.extract.maxTokens=800
ai.pro.extract.maxChars=60
ai.pro.extract.minChars=4
ai.pro.extract.minConfidence=0.5
ai.pro.extract.maxKeywords=8
ai.pro.extract.maxTags=8
ai.pro.review.enabled=true
ai.pro.review.max=10
ai.pro.merge.similarity=0.85
ai.pro.merge.maxKeywords=16
ai.pro.merge.maxTags=16
ai.pro.retrieve.deep=5
ai.pro.retrieve.shallow=5
ai.pro.retrieve.cache=3
ai.pro.retrieve.maxTotal=12
ai.pro.retrieve.maxChars=1200
ai.pro.retrieve.queryContextMessages=3
ai.pro.retrieve.minTokenScore=0.05
ai.pro.retrieve.dedupeSimilarity=0.85
ai.pro.retrieve.w.token=0.55
ai.pro.retrieve.w.importance=0.25
ai.pro.retrieve.w.tag=0.12
ai.pro.retrieve.w.recency=0.08
ai.pro.cacheToShallow.importance=0.65
ai.pro.cacheToShallow.hits=2
ai.pro.shallowToDeep.importance=0.75
ai.pro.shallowToDeep.stableDays=7
ai.pro.shallowToDeep.hits=3
ai.pro.deepToShallow.importance=0.45
ai.pro.deepToShallow.idleDays=30
ai.pro.score.w.explicit=0.30
ai.pro.score.w.access=0.20
ai.pro.score.w.trust=0.20
ai.pro.score.w.freshness=0.15
ai.pro.score.w.task=0.10
ai.pro.score.w.emotion=0.05
ai.pro.evict.w.importance=0.35
ai.pro.evict.w.unaccessed=0.25
ai.pro.evict.w.trust=0.15
ai.pro.evict.w.reconstruct=0.15
ai.pro.evict.w.redundancy=0.10
ai.pro.evict.unaccessedDays=60
ai.pro.emotion.enabled=true
ai.pro.emotion.decayRounds=3
ai.pro.emotion.halfLifeMinutes=30
ai.pro.emotion.aiWeight=0.5
ai.pro.emotion.memoryBaselineWeight=0.2
ai.pro.emotion.promptMaxIntensity=0.6
ai.pro.emotion.lexicon.positive=开心,高兴,喜欢,谢谢,太好了,哈哈
ai.pro.emotion.lexicon.negative=难过,生气,讨厌,烦,伤心,失望
ai.pro.emotion.lexicon.surprise=惊讶,居然,没想到,突然
ai.pro.emotion.lexicon.intimate=宝贝,亲爱的,想你,抱抱
ai.pro.emoji.enabled=true
ai.pro.emoji.autoImport=false
ai.pro.emoji.cooldownRounds=5
ai.pro.emoji.topCandidates=3
ai.pro.emoji.candidatePool=50
ai.pro.emoji.maxBytes=524288
ai.pro.emoji.maxGifBytes=2097152
ai.pro.emoji.sensitiveTags=政治,色情,暴力,广告,隐私
ai.pro.todo.enabled=true
ai.pro.todo.maxReminders=2
ai.pro.todo.maxRetries=1
ai.pro.todo.maxCreatePerRound=2
ai.pro.todo.maxActionsPerRound=5
ai.pro.todo.maxRemindersPerRound=5
ai.pro.todo.maxPendingPerUser=10
ai.pro.todo.maxChars=100
ai.pro.todo.confirmDraft=true
ai.pro.todo.draftTtlMinutes=10
ai.pro.todo.missWindowHours=24
ai.pro.todo.includeContentInGroup=true
ai.pro.todo.triggers=提醒我,记得提醒,别忘了,帮我记
ai.pro.privacy.mode=drop
ai.pro.privacy.patterns=
ai.pro.privacy.allowPhone=false
ai.pro.todo.timezone=Asia/Shanghai

# AI 群友（默认关闭；开启需填 apiKey）
ai.enabled=false
ai.apiKey=
ai.model=deepseek-flash
ai.baseUrl=https://api.deepseek.com/chat/completions
ai.thinking=false
# AI 是否识别图片/表情包
ai.vision=true
# AI 是否读取系统消息（加入/退出/撤回/拍一拍/广播等）
ai.systemMessages=true
# 强制提示词由服务端代码固定（交流方式、法律道德底线、输出格式），不可在此修改。
# 自定义提示词只补充大肥鱼的人设与表达风格。
ai.prompt.custom=你是“大肥鱼”，性格活泼、幽默，喜欢摸鱼，说话简短自然。可以适当使用轻松的网络表达，但不要过度玩梗，不要冒充人类。
ai.mentions=@大肥鱼,@AI
# 未被 @ 时命中的关键词；命中后按 keywordChance 概率参与
ai.keywords=大肥鱼,鱼,AI
ai.keywordChance=80
# 未命中 @ 和关键词时，随机参与概率（0-100）
ai.randomChance=20
ai.cooldownMs=3000
ai.maxContext=10
ai.timeoutMs=20000
ai.maxTokens=300
ai.messageMaxChars=30
ai.maxMessages=5
ai.replyDelayMs=600
ai.name=大肥鱼
ai.avatar=assets/ai_avatar.png
