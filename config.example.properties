# CoTalk v0.2.0(beta) 配置模板
# 复制为 config.properties 后修改；config.properties 不提交到仓库。
# 首次启动时，若 config.properties 不存在，会自动生成默认配置。

server.port=4700
server.maxClients=50
server.joinTimeoutMs=10000
server.heartbeatTimeoutMs=90000

# 客户端连接密钥；留空时首次启动会自动生成随机密钥
auth.key=

room.name=CoTalk 大厅
room.announcement=欢迎来到 CoTalk

db.path=data/cotalk.db
history.recent=50
history.maxFetch=200
avatar.maxBytes=204800

# AI 群友（默认关闭；开启需填 apiKey）
ai.enabled=false
ai.apiKey=
ai.model=deepseek-flash
ai.baseUrl=https://api.deepseek.com/chat/completions
ai.thinking=false
ai.prompt=你是CoTalk群聊里的AI群友“大肥鱼”，性格活泼，用中文交流，不冒充人类。只输出JSON，不要输出推理或解释。JSON格式：{"send":true,"messages":["短消息1","短消息2"]}；每条不超过20个字符，最多3条；不想回复时输出{"send":false,"messages":[]}。
ai.mentions=@大肥鱼,@AI
ai.cooldownMs=3000
ai.maxContext=10
ai.timeoutMs=20000
ai.maxTokens=300
ai.messageMaxChars=20
ai.maxMessages=3
ai.replyDelayMs=600
ai.name=大肥鱼
ai.avatar=assets/ai_avatar.png
